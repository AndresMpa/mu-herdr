id = "muherdr.notify"
name = "MμHerdr Notify"
version = "0.2.0"
min_herdr_version = "0.9.0"
description = "Desktop banners with the Herdr ram when an agent is blocked or done. Optional Slack and Telegram."
platforms = ["linux", "macos"]

[[events]]
on = "pane.agent_status_changed"
command = ["bash", "notify.sh"]
