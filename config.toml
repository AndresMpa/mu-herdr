# MμHerdr — Herdr keys. Clone to ~/.config/herdr
#
# Prefix is alt+esc (Option-Esc on Mac). Bare alt is invalid in Herdr.
# Option-Space cannot enter prefix mode on a Mac: it inserts a
# non-breaking space. cmd+b never reaches a Mac terminal.
# Herdr prefix mode takes one key. prefix+v and prefix+g open bin/chord
# so the rest of the sequence is the same letters (vv, vj, vk, gst).

onboarding = false

# BEGIN MμHerdr theme
[theme]
name = "tokyo-night"
auto_switch = false

[theme.custom]
panel_bg = "#0F111A"
sidebar_bg = "#0F111A"
active_row_bg = "#181A1F"
selection_bg = "#181A1F"
surface0 = "#181A1F"
surface1 = "#181A1F"
surface_dim = "#8F93A2"
overlay0 = "#84FFFF"
overlay1 = "#84FFFF"
text = "#C5C9D6"
subtext0 = "#C5C9D6"
accent = "#84FFFF"
blue = "#82AAFF"
green = "#C3E88D"
red = "#F07178"
yellow = "#FFCB6B"
teal = "#89DDFF"
mauve = "#C792EA"
peach = "#F78C6C"

[ui]
accent = "#84FFFF"
# END MμHerdr theme

# system = macOS Notification Center / Linux notify-send (not just sound).
# herdr = in-app toast only. terminal = ask the outer terminal.
[ui.toast]
delivery = "system"
delay_seconds = 1

[ui.toast.herdr]
position = "top-right"

[ui.sound]
enabled = true

[terminal]
default_shell = "zsh"
new_cwd = "follow"

[keys]
prefix = "alt+esc"

help = "prefix+?"
settings = "prefix+s"
reload_config = "prefix+shift+r"
open_notification_target = "prefix+o"

# Detach leaves panes running. prefix+q is Herdr's default for that.
# close_pane is prefix+x (not q): q must not kill the session.
close_pane = "prefix+x"
detach = ["prefix+d", "prefix+q"]
close_tab = "prefix+h"
close_workspace = "prefix+shift+d"

# Space j / k → previous / next buffer. Tabs are the Herdr analog.
previous_tab = "prefix+j"
next_tab = "prefix+k"
new_tab = "prefix+c"
rename_tab = "prefix+shift+t"
switch_tab = "prefix+1..9"

# vv / vj / vk are finished by bin/chord after prefix+v. Unbind natives.
zoom = ""
split_horizontal = ""
split_vertical = ""

# Space n → file tree
toggle_sidebar = "prefix+n"

# Ctrl-hjkl moves Herdr panes (no prefix).
focus_pane_left = "ctrl+h"
focus_pane_down = "ctrl+j"
focus_pane_up = "ctrl+k"
focus_pane_right = "ctrl+l"
cycle_pane_next = "prefix+tab"
cycle_pane_previous = "prefix+shift+tab"

resize_mode = "prefix+r"
resize_pane_left = ""
resize_pane_down = ""
resize_pane_up = ""
resize_pane_right = ""

workspace_picker = "prefix+w"
# prefix+g starts git chords (gst, gpl, …). Unbind workspace goto.
goto = ""
new_workspace = "prefix+shift+n"
new_worktree = ""
rename_workspace = "prefix+shift+w"

# Space vv / vj / vk
[[keys.command]]
key = "prefix+v"
type = "popup"
command = "bash ~/.config/herdr/bin/chord v"
description = "Panes"
width = "36%"
height = "18%"

# Space gst / gpl / gps / …
[[keys.command]]
key = "prefix+g"
type = "popup"
command = "bash ~/.config/herdr/bin/chord g"
description = "Git"
width = "90%"
height = "85%"

# Space l → :ls
[[keys.command]]
key = "prefix+l"
type = "popup"
command = "bash ~/.config/herdr/bin/chord l"
description = "Tabs"
width = "50%"
height = "40%"

# Space H → close other buffers
[[keys.command]]
key = "prefix+shift+h"
type = "shell"
command = "bash ~/.config/herdr/bin/chord H"
description = "Close other tabs"

# Space th → theme picker. prefix+t then t (or wait) splits like Ctrl-t.
[[keys.command]]
key = "prefix+t"
type = "popup"
command = "bash ~/.config/herdr/bin/chord t"
description = "Themes"
width = "50%"
height = "55%"

# SSH keys + hosts from ~/.ssh
[[keys.command]]
key = "prefix+e"
type = "popup"
command = "bash ~/.config/herdr/bin/ssh"
description = "SSH"
width = "70%"
height = "70%"

# Docker / Podman / nerdctl containers
[[keys.command]]
key = "prefix+p"
type = "popup"
command = "bash ~/.config/herdr/bin/container"
description = "Containers"
width = "80%"
height = "75%"
