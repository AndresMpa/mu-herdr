# MμHerdr — Herdr keys that follow MμVim, with a different action key.
# Clone to ~/.config/herdr
#
# MμVim leader is Space. Herdr prefix is Ctrl-B (ctrl+b).
# Option-Space cannot enter prefix mode on a Mac: it inserts a
# non-breaking space. cmd+b never reaches a Mac terminal.
# Herdr prefix mode takes one key. prefix+v and prefix+g open bin/chord
# so the rest of the sequence is the same letters as MμVim (vv, vj, vk, gst).

onboarding = false

# BEGIN MμHerdr theme
[theme]
name = "tokyo-night"
auto_switch = false

[theme.custom]
panel_bg = "#0F111A"
sidebar_bg = "#0F111A"
active_row_bg = "#181A1F"
selection_bg = "#181A1F"
surface0 = "#181A1F"
surface1 = "#181A1F"
surface_dim = "#8F93A2"
overlay0 = "#84FFFF"
overlay1 = "#84FFFF"
text = "#C5C9D6"
subtext0 = "#C5C9D6"
accent = "#84FFFF"
blue = "#82AAFF"
green = "#C3E88D"
red = "#F07178"
yellow = "#FFCB6B"
teal = "#89DDFF"
mauve = "#C792EA"
peach = "#F78C6C"

[ui]
accent = "#84FFFF"
# END MμHerdr theme

[terminal]
default_shell = "zsh"
new_cwd = "follow"

[keys]
prefix = "ctrl+b"

help = "prefix+?"
settings = "prefix+s"
reload_config = "prefix+shift+r"

# Space q → close pane. Detach is prefix+d so q can match Vim.
close_pane = "prefix+q"
detach = "prefix+d"
close_tab = "prefix+h"
close_workspace = "prefix+shift+d"

# Space j / k → previous / next buffer. Tabs are the Herdr analog.
previous_tab = "prefix+j"
next_tab = "prefix+k"
new_tab = "prefix+c"
rename_tab = "prefix+shift+t"
switch_tab = "prefix+1..9"

# vv / vj / vk are finished by bin/chord after prefix+v. Unbind natives.
zoom = ""
split_horizontal = ""
split_vertical = ""

# Space n → file tree
toggle_sidebar = "prefix+n"

# Ctrl-hjkl in MμVim moves windows. Same chords move Herdr panes (no prefix).
focus_pane_left = "ctrl+h"
focus_pane_down = "ctrl+j"
focus_pane_up = "ctrl+k"
focus_pane_right = "ctrl+l"
cycle_pane_next = "prefix+tab"
cycle_pane_previous = "prefix+shift+tab"

resize_mode = "prefix+r"
resize_pane_left = ""
resize_pane_down = ""
resize_pane_up = ""
resize_pane_right = ""

workspace_picker = "prefix+w"
# prefix+g starts git chords (gst, gpl, …). Unbind workspace goto.
goto = ""
new_workspace = "prefix+shift+n"
new_worktree = ""
rename_workspace = "prefix+shift+w"

# Space vv / vj / vk
[[keys.command]]
key = "prefix+v"
type = "popup"
command = "bash ~/.config/herdr/bin/chord v"
description = "vv zoom · vj split · vk vsplit"
width = "36%"
height = "18%"

# Space gst / gpl / gps / …
[[keys.command]]
key = "prefix+g"
type = "popup"
command = "bash ~/.config/herdr/bin/chord g"
description = "git (gst lazygit, gpl, gps, …)"
width = "90%"
height = "85%"

# Space l → :ls
[[keys.command]]
key = "prefix+l"
type = "popup"
command = "bash ~/.config/herdr/bin/chord l"
description = "List tabs"
width = "50%"
height = "40%"

# Space H → close other buffers
[[keys.command]]
key = "prefix+shift+h"
type = "shell"
command = "bash ~/.config/herdr/bin/chord H"
description = "Close other tabs"

# Space th → theme picker. prefix+t then t (or wait) splits like Ctrl-t.
[[keys.command]]
key = "prefix+t"
type = "popup"
command = "bash ~/.config/herdr/bin/chord t"
description = "tt new pane · th theme"
width = "50%"
height = "55%"
