# MμHerdr — Herdr keys. Clone to ~/.config/herdr
#
# Prefix is Ctrl-Alt-Space on every OS (Control-Option-Space on Mac).
# Survives terminals without the Kitty protocol. Not Ctrl-B, not Shift-Space.
# Option-Space cannot enter prefix mode on a Mac: it inserts a
# non-breaking space. cmd+b never reaches a Mac terminal.
# Herdr prefix mode takes one key. prefix+v and prefix+g open bin/chord
# so the rest of the sequence is the same letters (vv, vj, vk, gst).

onboarding = false

# BEGIN MμHerdr theme
[theme]
name = "gruvbox"
auto_switch = false

[theme.custom]
panel_bg = "#1d2021"
sidebar_bg = "#1d2021"
active_row_bg = "#3c3836"
selection_bg = "#3c3836"
surface0 = "#3c3836"
surface1 = "#3c3836"
surface_dim = "#928374"
overlay0 = "#fe8019"
overlay1 = "#fe8019"
text = "#ebdbb2"
subtext0 = "#ebdbb2"
accent = "#fe8019"
blue = "#83a598"
green = "#b8bb26"
red = "#fb4934"
yellow = "#fabd2f"
teal = "#8ec07c"
mauve = "#d3869b"
peach = "#fe8019"

[ui]
accent = "#fe8019"
# END MμHerdr theme

# Un-dim machine / tab / agent in the agents panel so the rows are readable.
status_indicators = "symbols"
[ui.sidebar.agents]
rows = [
  [
    "state_icon",
    { token = "machine", fg = "#89b4fa", dim = false },
    "workspace",
    { token = "tab", fg = "#cdd6f4", dim = false },
  ],
  [{ token = "agent", fg = "#a6adc8", dim = false }],
]

# Same treatment for the machines panel: branch + git status were dimmed.
[ui.sidebar.spaces]
rows = [
  ["state_icon", "workspace"],
  [
    { token = "branch", fg = "#89b4fa", dim = false },
    { token = "git_status", dim = false },
  ],
]

# herdr = in-app toast only. OS banners come from plugin/notify.sh (ram icon).
# system would duplicate a second banner with Herdr's default icon.
[ui.toast]
delivery = "herdr"
delay_seconds = 1

[ui.toast.herdr]
position = "top-right"

[ui.sound]
enabled = true

[terminal]
default_shell = "zsh"
new_cwd = "follow"

[keys]
prefix = "ctrl+alt+space"

help = "prefix+?"
settings = "prefix+s"
reload_config = "prefix+shift+r"
open_notification_target = "prefix+o"

# Detach leaves panes running. prefix+q is Herdr's default for that.
# close_pane is prefix+x (not q): q must not kill the session.
close_pane = "prefix+x"
detach = ["prefix+d", "prefix+q"]
close_tab = "prefix+h"
close_workspace = "prefix+shift+d"

# Space j / k → previous / next buffer. Tabs are the Herdr analog.
previous_tab = "prefix+j"
next_tab = "prefix+k"
new_tab = "prefix+c"
rename_tab = "prefix+shift+t"
switch_tab = "prefix+1..9"

# vv / vj / vk are finished by bin/chord after prefix+v. Unbind natives.
zoom = ""
split_horizontal = ""
split_vertical = ""

# Space n → file tree
toggle_sidebar = "prefix+n"

# Ctrl-hjkl moves Herdr panes (no prefix).
focus_pane_left = "ctrl+h"
focus_pane_down = "ctrl+j"
focus_pane_up = "ctrl+k"
focus_pane_right = "ctrl+l"
cycle_pane_next = "prefix+tab"
cycle_pane_previous = "prefix+shift+tab"

resize_mode = "prefix+r"
resize_pane_left = ""
resize_pane_down = ""
resize_pane_up = ""
resize_pane_right = ""

workspace_picker = "prefix+w"
# Native Navigate: j/k and up/down move the workspace list; h/l move panes.
navigate_workspace_up = ["k", "up"]
navigate_workspace_down = ["j", "down"]
navigate_pane_left = "h"
navigate_pane_right = "l"
navigate_pane_down = "ctrl+j"
navigate_pane_up = "ctrl+k"
# prefix+g starts git chords (gst, gpl, …). Unbind workspace goto.
goto = ""
new_workspace = "prefix+shift+n"
new_worktree = ""
rename_workspace = "prefix+shift+w"

# Space vv / vj / vk
[[keys.command]]
key = "prefix+v"
type = "popup"
command = "bash ~/.config/herdr/bin/chord v"
description = "Panes"
width = "36%"
height = "18%"

# Space gst / gpl / gps / …
[[keys.command]]
key = "prefix+g"
type = "popup"
command = "bash ~/.config/herdr/bin/chord g"
description = "Git"
width = "90%"
height = "85%"

# Space l → :ls
[[keys.command]]
key = "prefix+l"
type = "popup"
command = "bash ~/.config/herdr/bin/chord l"
description = "Tabs"
width = "50%"
height = "40%"

# Space H → close other buffers
[[keys.command]]
key = "prefix+shift+h"
type = "shell"
command = "bash ~/.config/herdr/bin/chord H"
description = "Close other tabs"

# Space th → theme picker. prefix+t then t (or wait) splits like Ctrl-t.
[[keys.command]]
key = "prefix+t"
type = "popup"
command = "bash ~/.config/herdr/bin/chord t"
description = "Themes"
width = "50%"
height = "55%"

# SSH keys + hosts from ~/.ssh
[[keys.command]]
key = "prefix+e"
type = "popup"
command = "bash ~/.config/herdr/bin/ssh"
description = "SSH"
width = "70%"
height = "70%"

# Docker / Podman / nerdctl containers
[[keys.command]]
key = "prefix+p"
type = "popup"
command = "bash ~/.config/herdr/bin/container"
description = "Containers"
width = "80%"
height = "75%"
